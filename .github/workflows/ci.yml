name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "build/**"
      - "chore/**"
      - "ci/**"
      - "docs/**"
      - "style/**"
      - "refactor/**"
      - "test/**"
      - "perf/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: which
          POSTGRES_USER: which
          POSTGRES_PASSWORD: which_local
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U which -d which"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://which:which_local@localhost:54329/which

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check

      - name: Verify Cloud Run runtime isolation
        run: node --test scripts/cloud-run/runtime.test.mjs
