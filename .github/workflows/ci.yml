name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "build/**"
      - "chore/**"
      - "ci/**"
      - "docs/**"
      - "style/**"
      - "refactor/**"
      - "test/**"
      - "perf/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check
