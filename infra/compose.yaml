name: which-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-which}
      POSTGRES_USER: ${POSTGRES_USER:-which}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-which_local}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - which-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  which-postgres-data:
