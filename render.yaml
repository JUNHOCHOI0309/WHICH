# Cost-optimized Render production Blueprint for the WHICH MVP.
#
# Next.js and the Fastify API run in one always-on Starter instance. Next.js is
# the only public listener; the API listens on loopback port 4000. The existing
# `which-db` Postgres instance remains managed in the Render dashboard.
services:
  - type: web
    name: which-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @which/api build && pnpm --filter @which/web build
    preDeployCommand: pnpm --filter @which/api db:migrate
    startCommand: node scripts/start-render.mjs
    healthCheckPath: /
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - apps/api/**
        - apps/web/**
        - packages/**
        - scripts/start-render.mjs
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - turbo.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 127.0.0.1
      - key: API_PORT
        value: "4000"
      - key: API_BASE_URL
        value: http://127.0.0.1:4000
      - key: DATABASE_URL
        fromDatabase:
          name: which-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://whichone.site
      - key: AUTH_BASE_URL
        value: https://whichone.site
      - key: LOG_LEVEL
        value: info
      # Render exposes this service's immutable commit as RENDER_GIT_COMMIT.
      # The Gate uses it automatically as the expected API release ID.
      - key: LAUNCH_GATE_TARGET_ENVIRONMENT
        value: production
      - key: LAUNCH_GATE_API_URL
        value: http://127.0.0.1:4000
      - key: LAUNCH_GATE_PUBLIC_WEB_URL
        value: https://whichone.site
      # No real HTTP Event consumer exists for the cost-optimized MVP yet.
      # Pending Events remain durable and Dead Letters still block the Gate.
      - key: LAUNCH_GATE_OUTBOX_DELIVERY_REQUIRED
        value: "false"
      - key: LAUNCH_GATE_ISSUE_ID
        sync: false
      - key: LAUNCH_GATE_ISSUE_VERSION
        value: "1"
      - key: LAUNCH_GATE_MAX_DEAD_LETTERS
        value: "0"
      - key: LAUNCH_GATE_MAX_PENDING_AGE_SECONDS
        value: "300"
      # The Web BFF falls back to this same value for API authentication.
      - key: INTERNAL_AUTH_SECRET
        generateValue: true
      - key: MODERATION_INTERNAL_SECRET
        generateValue: true
      - key: AUTH_FLOW_SECRET
        generateValue: true
      - key: MEMBER_SESSION_TTL_SECONDS
        value: "604800"
      - key: FEATURE_COMMENTS_ENABLED
        value: "false"
      - key: FEATURE_CREATOR_SUBMISSIONS_ENABLED
        value: "false"
      - key: FEATURE_ML_RANKER_ENABLED
        value: "true"
      - key: FEATURE_RESULT_SHARING_ENABLED
        value: "false"
      - key: FEATURE_RISK_CHALLENGE_ENABLED
        value: "false"
      - key: GOOGLE_OIDC_CLIENT_ID
        sync: false
      - key: GOOGLE_OIDC_CLIENT_SECRET
        sync: false
      - key: X_OAUTH_CLIENT_ID
        sync: false
      - key: X_OAUTH_CLIENT_SECRET
        sync: false
      - key: NAVER_OIDC_CLIENT_ID
        sync: false
      - key: NAVER_OIDC_CLIENT_SECRET
        sync: false
      # Enable only after credentials, real callback testing, and Naver review.
      - key: FEATURE_NAVER_LOGIN_ENABLED
        value: "false"
