# Cost-optimized Render production Blueprint for the WHICH MVP.
#
# Next.js and the Fastify API run in one always-on Starter instance. Next.js is
# the only public listener; the API listens on loopback port 4000. The existing
# `which-db` Postgres instance remains managed in the Render dashboard.
services:
  - type: web
    name: which-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @which/api build && pnpm --filter @which/web build
    preDeployCommand: pnpm --filter @which/api db:migrate
    startCommand: node scripts/start-render.mjs
    healthCheckPath: /
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - apps/api/**
        - apps/web/**
        - packages/**
        - scripts/start-render.mjs
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - turbo.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 127.0.0.1
      - key: API_PORT
        value: "4000"
      - key: API_BASE_URL
        value: http://127.0.0.1:4000
      - key: DATABASE_URL
        fromDatabase:
          name: which-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://whichone.site
      - key: AUTH_BASE_URL
        value: https://whichone.site
      - key: LOG_LEVEL
        value: info
      # Render exposes this service's immutable commit as RENDER_GIT_COMMIT.
      # The Gate uses it automatically as the expected API release ID.
      - key: LAUNCH_GATE_TARGET_ENVIRONMENT
        value: production
      - key: LAUNCH_GATE_API_URL
        value: http://127.0.0.1:4000
      - key: LAUNCH_GATE_PUBLIC_WEB_URL
        value: https://whichone.site
      # No real HTTP Event consumer exists for the cost-optimized MVP yet.
      # Pending Events remain durable and Dead Letters still block the Gate.
      - key: LAUNCH_GATE_OUTBOX_DELIVERY_REQUIRED
        value: "false"
      - key: LAUNCH_GATE_ISSUE_ID
        sync: false
      - key: LAUNCH_GATE_ISSUE_VERSION
        value: "1"
      - key: LAUNCH_GATE_MAX_DEAD_LETTERS
        value: "0"
      - key: LAUNCH_GATE_MAX_PENDING_AGE_SECONDS
        value: "300"
      # The Web BFF falls back to this same value for API authentication.
      - key: INTERNAL_AUTH_SECRET
        generateValue: true
      - key: MODERATION_INTERNAL_SECRET
        generateValue: true
      # Safety provider is wired in Shadow mode but remains fail-closed until all
      # approval evidence is recorded and an operator deliberately opens a canary.
      - key: MODERATION_PROVIDER_MODE
        value: "OFF"
      - key: MODERATION_PROVIDER
        value: OPENAI_MODERATION
      - key: MODERATION_PROVIDER_KILL_SWITCH
        value: "true"
      - key: MODERATION_PROVIDER_CANARY_PERCENT
        value: "0"
      - key: MODERATION_PROVIDER_DAILY_CALL_CAP
        value: "0"
      - key: MODERATION_PROVIDER_DAILY_COST_MICROS_CAP
        value: "0"
      - key: MODERATION_PROVIDER_CIRCUIT_WINDOW_MINUTES
        value: "5"
      - key: MODERATION_PROVIDER_CIRCUIT_MIN_CALLS
        value: "5"
      - key: MODERATION_PROVIDER_CIRCUIT_FAILURE_PERCENT
        value: "50"
      - key: MODERATION_PROVIDER_APPROVAL_EVIDENCE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODERATION_MODEL
        value: omni-moderation-2024-09-26
      - key: OPENAI_MODERATION_TIMEOUT_MS
        value: "10000"
      - key: AUTH_FLOW_SECRET
        generateValue: true
      - key: MEMBER_SESSION_TTL_SECONDS
        value: "604800"
      - key: MOBILE_AUTH_TICKET_TTL_SECONDS
        value: "300"
      - key: AUTH_EMAIL_VERIFICATION_TTL_SECONDS
        value: "86400"
      - key: AUTH_PASSWORD_RESET_TTL_SECONDS
        value: "1800"
      - key: AUTH_RATE_LIMIT_WINDOW_SECONDS
        value: "900"
      - key: AUTH_SIGNUP_RATE_LIMIT
        value: "5"
      - key: AUTH_LOGIN_RATE_LIMIT
        value: "10"
      - key: AUTH_EMAIL_DELIVERY_RATE_LIMIT
        value: "3"
      - key: AUTH_TOKEN_CONSUME_RATE_LIMIT
        value: "10"
      # Operator dashboard defense-in-depth. Configure both after creating the
      # Cloudflare Access self-hosted application for /ops* and /api/ops/*.
      - key: CF_ACCESS_TEAM_DOMAIN
        sync: false
      - key: CF_ACCESS_AUD
        sync: false
      - key: OPS_CHANGE_ACTOR
        value: render-shell
      # Flip to true only after Resend setup and verification-link QA.
      - key: AUTH_EMAIL_VERIFICATION_REQUIRED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: AUTH_EMAIL_REPLY_TO
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      # Optional profile-image storage. The app remains healthy when these are unset.
      # R2 stores only normalized 512px WebP objects under avatars/{memberId}/.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: FEATURE_COMMENTS_ENABLED
        value: "false"
      - key: FEATURE_CREATOR_SUBMISSIONS_ENABLED
        value: "true"
      - key: FEATURE_ML_RANKER_ENABLED
        value: "true"
      - key: FEATURE_RESULT_SHARING_ENABLED
        value: "true"
      - key: FEATURE_ISSUE_MEDIA_ENABLED
        value: "false"
      - key: ISSUE_MEDIA_EXPERIMENT_PERCENT
        value: "0"
      - key: ISSUE_MEDIA_RULE_GATE_MODE
        value: "ENFORCE"
      - key: QUALITY_RANKER_MODE
        value: "SHADOW"
      - key: FEATURE_POINTS_ENABLED
        value: "true"
      - key: FEATURE_RISK_CHALLENGE_ENABLED
        value: "false"
      - key: GOOGLE_OIDC_CLIENT_ID
        sync: false
      - key: GOOGLE_OIDC_CLIENT_SECRET
        sync: false
      - key: X_OAUTH_CLIENT_ID
        sync: false
      - key: X_OAUTH_CLIENT_SECRET
        sync: false
      - key: NAVER_OIDC_CLIENT_ID
        sync: false
      - key: NAVER_OIDC_CLIENT_SECRET
        sync: false
      # Naver production credentials and real-account callback were verified in WHICH-20.
      - key: FEATURE_NAVER_LOGIN_ENABLED
        value: "true"
      - key: KAKAO_OIDC_CLIENT_ID
        sync: false
      - key: KAKAO_OIDC_CLIENT_SECRET
        sync: false
      # Kakao Developers credentials and production callback are configured for WHICH-32.
      - key: FEATURE_KAKAO_LOGIN_ENABLED
        value: "true"
